name: Create Draft Release

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Check release state
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATE=$(gh release view "v${{ steps.version.outputs.version }}" --json isDraft --jq '.isDraft' 2>/dev/null || echo "not_found")
          echo "state=${STATE}" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Get previous version tag
        if: steps.check.outputs.state != 'false'
        id: previous_version
        run: |
          CURRENT="v${{ steps.version.outputs.version }}"
          PREVIOUS_VERSION=$(git tag --sort=-v:refname | grep -v "^${CURRENT}$" | head -1)
          echo "tag=${PREVIOUS_VERSION}" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Install Nix
        if: steps.check.outputs.state != 'false'
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          enable_kvm: true
          extra_nix_config: |
            keep-outputs = true
            keep-failed = true

      - name: Build release notes
        if: steps.check.outputs.state != 'false'
        run: |
          VERSION="v${{ steps.version.outputs.version }}"
          PREVIOUS_VERSION="${{ steps.previous_version.outputs.tag }}"
          {
            nix run .#extract-changelog -- CHANGELOG.md "$VERSION"
            echo ""
            echo "Changelog: https://github.com/${{ github.repository }}/blob/${VERSION}/CHANGELOG.md"
            echo "Commit: https://github.com/${{ github.repository }}/compare/${PREVIOUS_VERSION}...${VERSION}"
          } > release_notes.md

      - name: Create draft release
        if: steps.check.outputs.state == 'not_found'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --draft \
            --title "v${{ steps.version.outputs.version }}" \
            --notes-file release_notes.md

      - name: Update draft release
        if: steps.check.outputs.state == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "v${{ steps.version.outputs.version }}" \
            --notes-file release_notes.md
